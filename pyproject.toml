# spx-momentum — scaffold per docs/superpowers/plans/2026-10-05-spx-momentum-scaffold.md
# Spec: DESIGN-DOC.md §4.3. uv-managed; ruff/mypy/pytest config inline.
[project]
name = "spx-momentum"
version = "0.1.0"
description = "S&P 500 cross-sectional momentum: data pipeline + custom backtester (research demo)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "duckdb>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "yfinance>=0.2.40",
    "PyYAML>=6.0",
    "streamlit>=1.36",
    "matplotlib>=3.9",
    "pyarrow>=16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "apache-airflow>=2.9",
]

[project.scripts]
spx-dashboard = "spx_momentum.ui.dashboard:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spx_momentum"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["workbook.ipynb", "opencode.json", "opencode.jsonc"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
